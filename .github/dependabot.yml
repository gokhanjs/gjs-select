version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # typescript-eslint rejects TS 7 outright, which fails `pnpm lint`.
      - dependency-name: typescript
        versions:
          - "7.x"
      # Must track the Node major that CI and Vercel run, not the newest release.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # eslint-plugin-react, pulled in by eslint-config-next, crashes on ESLint 10.
      - dependency-name: eslint
        versions:
          - "10.x"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
